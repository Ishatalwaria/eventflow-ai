x-eventflow-environment: &eventflow-environment
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DEBUG: "${DEBUG:-true}"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-eventflow}
  POSTGRES_USER: ${POSTGRES_USER:-eventflow-user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-3}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-3000}
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  METRICS_PORT: 9100
  WORKER_METRICS_URLS: http://outbox-publisher:9100/metrics,http://kafka-consumer:9100/metrics,http://workflow-worker:9100/metrics,http://analytics-consumer:9100/metrics
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-eventflow.kafka-to-rabbit.v1}
  BROKER_CONNECT_TIMEOUT: ${BROKER_CONNECT_TIMEOUT:-5}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
  OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
  OUTBOX_ALERT_AGE_SECONDS: ${OUTBOX_ALERT_AGE_SECONDS:-300}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-eventflow-local}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  RABBITMQ_USE_TLS: "false"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-eventflow}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-eventflow}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-eventflow-local-only}
  CLICKHOUSE_SECURE: "false"
  CLICKHOUSE_CONNECT_TIMEOUT: ${CLICKHOUSE_CONNECT_TIMEOUT:-3}
  CLICKHOUSE_SEND_RECEIVE_TIMEOUT: ${CLICKHOUSE_SEND_RECEIVE_TIMEOUT:-5}
  INCIDENT_LLM_PROVIDER: ${INCIDENT_LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
  GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
  INCIDENT_LLM_TIMEOUT_SECONDS: ${INCIDENT_LLM_TIMEOUT_SECONDS:-45}
  INCIDENT_LLM_MAX_OUTPUT_TOKENS: ${INCIDENT_LLM_MAX_OUTPUT_TOKENS:-1200}
  INCIDENT_LLM_MAX_ATTEMPTS: ${INCIDENT_LLM_MAX_ATTEMPTS:-2}
  INCIDENT_LLM_RETRY_DELAY_SECONDS: ${INCIDENT_LLM_RETRY_DELAY_SECONDS:-0.25}
  INCIDENT_SUMMARY_RATE_LIMIT: ${INCIDENT_SUMMARY_RATE_LIMIT:-30}

x-eventflow-app: &eventflow-app
  build:
    context: .
    pull: true
  restart: unless-stopped
  environment: *eventflow-environment

services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
      POSTGRES_USER: ${POSTGRES_USER:-eventflow-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *eventflow-app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *eventflow-app
    environment:
      <<: *eventflow-environment
      PROMETHEUS_MULTIPROC_DIR: /tmp/eventflow-prometheus
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:4.3.2
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eventflow.domain.events.v1 --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eventflow.workflow.lifecycle.v1 --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic eventflow.integration.events.v1 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-eventflow-local}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-eventflow}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-eventflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-eventflow-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USERNAME:-eventflow}", "--password", "${CLICKHOUSE_PASSWORD:-eventflow-local-only}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox-publisher:
    <<: *eventflow-app
    command: ["python", "manage.py", "publish_outbox"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9101:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  kafka-consumer:
    <<: *eventflow-app
    command: ["python", "manage.py", "consume_domain_events"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9102:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  workflow-worker:
    <<: *eventflow-app
    command: ["python", "manage.py", "process_workflows"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9103:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  analytics-consumer:
    <<: *eventflow-app
    command: ["python", "manage.py", "consume_lifecycle_analytics"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9104:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  rabbitmq_data:
  clickhouse_data:
